<h3 id="%E7%A7%BB%E5%8A%A8%E5%BA%94%E7%94%A8%E7%9A%84%E4%B8%89%E7%A7%8D%E5%BD%A2%E6%80%81">移动应用的三种形态</h3>
<table>
<thead>
<tr>
<th>形态</th>
<th>技术栈</th>
<th>特点</th>
</tr>
</thead>
<tbody>
<tr>
<td>原生应用</td>
<td>Kotlin/Java、Swift/OC</td>
<td>性能最好，能力最全，需分平台开发</td>
</tr>
<tr>
<td>跨平台应用</td>
<td>Flutter、React Native、KMP</td>
<td>一套代码多端运行，受框架能力约束</td>
</tr>
<tr>
<td>Web 应用</td>
<td>HTML/CSS/JS、PWA</td>
<td>免安装、易更新，系统能力受限</td>
</tr>
</tbody>
</table>
<blockquote>
<p>本课程聚焦 <strong>原生 Android 开发</strong>，语言为 <strong>Kotlin</strong>，UI 框架为 <strong>Jetpack Compose</strong>。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="5" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E5%85%88%E5%AD%A6%E5%8E%9F%E7%94%9F">为什么先学原生</h3>
<ul>
<li>原生开发是理解移动平台的<strong>基础</strong>：进程模型、生命周期、权限、渲染</li>
<li>跨平台框架最终仍要落到原生能力上（插件、桥接、平台通道）</li>
<li>掌握原生后再学 Flutter / KMP，只是换一层语法外壳</li>
<li>就业市场对“懂原生的跨平台工程师”需求更高</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>

<h3 id="android-%E7%94%9F%E6%80%81%E7%9A%84%E5%9F%BA%E6%9C%AC%E4%BA%8B%E5%AE%9E">Android 生态的基本事实</h3>
<ul>
<li>全球市场份额长期居于首位，设备形态多样（手机、平板、车机、TV、可穿戴）</li>
<li>碎片化：厂商 ROM、屏幕尺寸、系统版本并存 → <strong>兼容性</strong>是常态问题</li>
<li>分发渠道多元：Google Play、国内各应用商店、企业分发</li>
<li>Google 官方推荐技术栈：Kotlin + Jetpack + Compose + Material Design</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>

<h3 id="android-%E7%B3%BB%E7%BB%9F%E5%88%86%E5%B1%82">Android 系统分层</h3>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="9" style="" data-marpit-pagination-total="41" data-size="16:9" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="10" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="android-runtimeart">Android Runtime（ART）</h3>
<ul>
<li>应用代码编译为 <strong>DEX 字节码</strong>，由 ART 执行</li>
<li>混合编译策略：
<ul>
<li><strong>AOT</strong>：安装或空闲时预编译为机器码</li>
<li><strong>JIT</strong>：运行时热点方法即时编译</li>
<li><strong>Profile-guided</strong>：根据实际使用情况优化</li>
</ul>
</li>
<li>相比早期 Dalvik：启动更快、GC 停顿更短、内存占用更优</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="11" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="api-level-%E4%B8%8E%E7%89%88%E6%9C%AC%E5%85%BC%E5%AE%B9">API Level 与版本兼容</h3>
<ul>
<li>每个 Android 版本对应一个 <strong>API Level</strong>（如 Android 14 → API 34）</li>
<li>三个关键配置：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">android {
    compileSdk = <span class="hljs-number">36</span>        <span class="hljs-comment">// 用哪套 SDK 编译（通常取最新）</span>
    defaultConfig {
        minSdk = <span class="hljs-number">24</span>        <span class="hljs-comment">// 最低支持的系统版本</span>
        targetSdk = <span class="hljs-number">36</span>     <span class="hljs-comment">// 已针对该版本适配（影响运行时行为）</span>
    }
}
</code></pre>
<blockquote>
<p><code>minSdk</code> 越低覆盖用户越多，但可用 API 越少；<code>targetSdk</code> 不升级会触发商店合规限制。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="12" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E5%BA%94%E7%94%A8%E6%B2%99%E7%AE%B1%E4%B8%8E%E5%AE%89%E5%85%A8%E6%A8%A1%E5%9E%8B">应用沙箱与安全模型</h3>
<ul>
<li>每个应用运行在<strong>独立进程</strong>，拥有独立的 Linux UID</li>
<li>应用私有目录（<code>/data/data/&lt;包名&gt;/</code>）默认其他应用不可访问</li>
<li>跨应用访问必须通过：Intent、ContentProvider、权限声明</li>
<li>危险权限必须在<strong>运行时</strong>由用户授权（Android 6.0+）</li>
<li>分区存储（Scoped Storage）限制了对公共存储的自由读写</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>

<h3 id="kotlin-%E7%AE%80%E4%BB%8B">Kotlin 简介</h3>
<ul>
<li>JetBrains 于 2011 年发布，2016 年 1.0，2017 年成为 Android 官方支持语言</li>
<li>2019 年 Google 宣布 <strong>Kotlin-first</strong>：新 API、新文档、新示例优先 Kotlin</li>
<li>运行在 JVM 上，编译为与 Java 相同的字节码</li>
<li>支持多目标：Kotlin/JVM、Kotlin/JS、Kotlin/Native、Kotlin Multiplatform</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="16" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="kotlin-%E8%A7%A3%E5%86%B3%E4%BA%86%E4%BB%80%E4%B9%88%E9%97%AE%E9%A2%98">Kotlin 解决了什么问题</h3>
<table>
<thead>
<tr>
<th>Java 的痛点</th>
<th>Kotlin 的方案</th>
</tr>
</thead>
<tbody>
<tr>
<td>NullPointerException 频发</td>
<td>类型系统区分可空 / 非空</td>
</tr>
<tr>
<td>大量样板代码（getter/setter/equals）</td>
<td><code>data class</code>、属性、默认参数</td>
</tr>
<tr>
<td>匿名内部类回调地狱</td>
<td>Lambda、高阶函数、协程</td>
</tr>
<tr>
<td>工具类膨胀（<code>StringUtils</code>）</td>
<td>扩展函数</td>
</tr>
<tr>
<td>异步代码难写难读</td>
<td>协程：以同步写法写异步</td>
</tr>
</tbody>
</table>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="17" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E4%B8%80%E6%AE%B5%E4%BB%A3%E7%A0%81%E7%9A%84%E5%AF%B9%E6%AF%94">一段代码的对比</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Java</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String name;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">User</span><span class="hljs-params">(String name)</span> { <span class="hljs-built_in">this</span>.name = name; }
    <span class="hljs-keyword">public</span> String <span class="hljs-title function_">getName</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> name; }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> String <span class="hljs-title function_">toString</span><span class="hljs-params">()</span> { <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;User{name=&quot;</span> + name + <span class="hljs-string">&quot;}&quot;</span>; }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">equals</span><span class="hljs-params">(Object o)</span> { <span class="hljs-comment">/* ... */</span> }
    <span class="hljs-meta">@Override</span> <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">hashCode</span><span class="hljs-params">()</span> { <span class="hljs-comment">/* ... */</span> }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// Kotlin</span>
<span class="hljs-keyword">data</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-keyword">val</span> name: String)
</code></pre>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="18" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E4%B8%8E-java-%E4%BA%92%E6%93%8D%E4%BD%9C">与 Java 互操作</h3>
<ul>
<li>Kotlin 可直接调用任意 Java 类库，反之亦然</li>
<li>同一模块中 <code>.kt</code> 与 <code>.java</code> 文件可共存、互相引用</li>
<li>平台类型（<code>String!</code>）：来自 Java 的值编译器无法判断可空性</li>
<li>常用注解：<code>@JvmStatic</code>、<code>@JvmOverloads</code>、<code>@JvmField</code>、<code>@Nullable/@NonNull</code></li>
</ul>
<blockquote>
<p>老项目迁移可以<strong>逐文件</strong>进行，不必一次性重写。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>

<h3 id="jdk-%E5%AE%89%E8%A3%85%E4%B8%8E%E9%AA%8C%E8%AF%81">JDK 安装与验证</h3>
<ol>
<li>下载并安装 JDK 17+（或解压绿色版到无空格、无中文的路径）</li>
<li>配置环境变量（Windows）
<ul>
<li><code>JAVA_HOME</code> = JDK 安装目录</li>
<li><code>Path</code> 追加 <code>%JAVA_HOME%\bin</code></li>
</ul>
</li>
<li>验证</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">java -version
javac -version
</code></pre>
<blockquote>
<p>macOS / Linux 在 <code>~/.zshrc</code> 中 <code>export JAVA_HOME=$(/usr/libexec/java_home -v 17)</code></p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="22" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="android-studio-%E5%AE%89%E8%A3%85%E8%A6%81%E7%82%B9">Android Studio 安装要点</h3>
<ol>
<li>运行安装程序，选择 “Do not import settings”</li>
<li>安装路径避免系统盘、中文与空格（如 <code>D:\Android\AndroidStudio</code>）</li>
<li>组件保持默认：Android Studio + Android Virtual Device</li>
<li>首次启动的 Setup Wizard 会下载 SDK，<strong>此时先配置代理/镜像</strong></li>
<li>SDK 存放路径同样避免中文（如 <code>D:\Android\Sdk</code>）</li>
</ol>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="23" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="gradle-%E5%9B%BD%E5%86%85%E9%95%9C%E5%83%8F%E9%85%8D%E7%BD%AE">Gradle 国内镜像配置</h3>
<p>在用户目录 <code>.gradle/</code> 下创建 <code>init.gradle</code>（或 <code>init.gradle.kts</code>）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-groovy">allprojects {
    repositories {
        maven { url <span class="hljs-string">&#x27;https://maven.aliyun.com/repository/google&#x27;</span> }
        maven { url <span class="hljs-string">&#x27;https://maven.aliyun.com/repository/central&#x27;</span> }
        maven { url <span class="hljs-string">&#x27;https://maven.aliyun.com/repository/gradle-plugin&#x27;</span> }
        maven { url <span class="hljs-string">&#x27;https://mirrors.huaweicloud.com/repository/maven&#x27;</span> }
        google()
        mavenCentral()
    }
}
</code></pre>
<blockquote>
<p>该文件对<strong>所有项目</strong>生效，是解决“依赖下载卡住”的首选手段。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="24" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="sdk-manager-%E4%B8%8E-avd-manager">SDK Manager 与 AVD Manager</h3>
<ul>
<li><strong>SDK Manager</strong>（Settings → Languages &amp; Frameworks → Android SDK）
<ul>
<li>SDK Platforms：勾选目标 API 与最低 API</li>
<li>SDK Tools：Build-Tools、Platform-Tools、Emulator、Command-line Tools</li>
</ul>
</li>
<li><strong>AVD Manager</strong>（Device Manager）
<ul>
<li>选设备型号（如 Pixel 6）→ 选系统镜像（带 Google APIs）→ Finish</li>
<li>x86_64 镜像在 Intel/AMD 上需开启硬件加速；Apple Silicon 选 arm64 镜像</li>
</ul>
</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>

<h3 id="%E7%9C%9F%E6%9C%BA%E8%B0%83%E8%AF%95">真机调试</h3>
<ol>
<li>设置 → 关于手机 → 连续点击“版本号” 7 次，开启开发者模式</li>
<li>开发者选项中打开 <strong>USB 调试</strong></li>
<li>USB 连接电脑，手机端确认授权指纹</li>
<li>验证连接</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">adb devices
</code></pre>
<blockquote>
<p>部分国产 ROM 还需额外打开“USB 安装”“USB 调试(安全设置)”。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>

<h3 id="androidmanifestxml">AndroidManifest.xml</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">manifest</span> <span class="hljs-attr">xmlns:android</span>=<span class="hljs-string">&quot;http://schemas.android.com/apk/res/android&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">application</span> <span class="hljs-attr">android:label</span>=<span class="hljs-string">&quot;@string/app_name&quot;</span> <span class="hljs-attr">android:theme</span>=<span class="hljs-string">&quot;@style/Theme.FirstApp&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">activity</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;.MainActivity&quot;</span> <span class="hljs-attr">android:exported</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span>
            <span class="hljs-tag">&lt;<span class="hljs-name">intent-filter</span>&gt;</span>
                <span class="hljs-tag">&lt;<span class="hljs-name">action</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;android.intent.action.MAIN&quot;</span> /&gt;</span>
                <span class="hljs-tag">&lt;<span class="hljs-name">category</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;android.intent.category.LAUNCHER&quot;</span> /&gt;</span>
            <span class="hljs-tag">&lt;/<span class="hljs-name">intent-filter</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">activity</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">application</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">manifest</span>&gt;</span>
</code></pre>
<ul>
<li>声明组件、权限、图标、主题；<code>LAUNCHER</code> 决定哪个界面是启动页</li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="30" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E6%A8%A1%E5%9D%97%E7%BA%A7-buildgradlekts">模块级 build.gradle.kts</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}
android {
    namespace = <span class="hljs-string">&quot;com.example.firstapp&quot;</span>
    compileSdk = <span class="hljs-number">36</span>
    defaultConfig { minSdk = <span class="hljs-number">24</span>; targetSdk = <span class="hljs-number">36</span>; versionCode = <span class="hljs-number">1</span>; versionName = <span class="hljs-string">&quot;1.0&quot;</span> }
    buildFeatures { compose = <span class="hljs-literal">true</span> }
}
dependencies {
    implementation(platform(libs.androidx.compose.bom))

}
</code></pre>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="31" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E7%89%88%E6%9C%AC%E7%9B%AE%E5%BD%95-libsversionstoml">版本目录 libs.versions.toml</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-toml"><span class="hljs-section">[versions]</span>
<span class="hljs-attr">kotlin</span> = <span class="hljs-string">&quot;2.2.0&quot;</span>
<span class="hljs-attr">composeBom</span> = <span class="hljs-string">&quot;2025.06.00&quot;</span>

<span class="hljs-section">[libraries]</span>
<span class="hljs-attr">androidx-material3</span> = { group = <span class="hljs-string">&quot;androidx.compose.material3&quot;</span>, name = <span class="hljs-string">&quot;material3&quot;</span> }
<span class="hljs-attr">androidx-compose-bom</span> = { group = <span class="hljs-string">&quot;androidx.compose&quot;</span>, name = <span class="hljs-string">&quot;compose-bom&quot;</span>, version.ref = <span class="hljs-string">&quot;composeBom&quot;</span> }

<span class="hljs-section">[plugins]</span>
<span class="hljs-attr">kotlin-android</span> = { id = <span class="hljs-string">&quot;org.jetbrains.kotlin.android&quot;</span>, version.ref = <span class="hljs-string">&quot;kotlin&quot;</span> }
</code></pre>
<blockquote>
<p>集中管理依赖版本，避免多模块版本漂移。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="32" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="mainactivity-%E9%95%BF%E4%BB%80%E4%B9%88%E6%A0%B7">MainActivity 长什么样</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MainActivity</span> : <span class="hljs-type">ComponentActivity</span>() {
    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onCreate</span><span class="hljs-params">(savedInstanceState: <span class="hljs-type">Bundle</span>?)</span></span> {
        <span class="hljs-keyword">super</span>.onCreate(savedInstanceState)
        setContent {
            FirstAppTheme {
                Greeting(name = <span class="hljs-string">&quot;Android&quot;</span>)
            }
        }
    }
}

<span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">Greeting</span><span class="hljs-params">(name: <span class="hljs-type">String</span>)</span></span> {
    Text(text = <span class="hljs-string">&quot;Hello, <span class="hljs-variable">$name</span>!&quot;</span>)
}
</code></pre>
<ul>
<li><code>setContent {}</code> 取代了传统的 <code>setContentView(R.layout.xxx)</code></li>
</ul>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>

<p><img src="images/01-source2apk.svg" alt="" /></p>
<ul>

<h3 id="apk-%E4%B8%8E-aab">APK 与 AAB</h3>
<table>
<thead>
<tr>
<th></th>
<th>APK</th>
<th>AAB (Android App Bundle)</th>
</tr>
</thead>
<tbody>
<tr>
<td>用途</td>
<td>直接安装、旁加载</td>
<td>上传应用商店</td>
</tr>
<tr>
<td>内容</td>
<td>全量资源</td>
<td>由商店按设备裁剪生成 APK</td>
</tr>
<tr>
<td>体积</td>
<td>较大</td>
<td>用户下载体积更小</td>
</tr>
<tr>
<td>命令</td>
<td><code>assembleRelease</code></td>
<td><code>bundleRelease</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Google Play 已强制要求新应用使用 AAB；国内商店多数仍用 APK。</p>
</blockquote>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="37" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="adb-%E5%B8%B8%E7%94%A8%E5%91%BD%E4%BB%A4">ADB 常用命令</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">adb devices                    <span class="hljs-comment"># 列出已连接设备</span>
adb install -r app-debug.apk   <span class="hljs-comment"># 安装/覆盖安装</span>
adb uninstall com.example.app  <span class="hljs-comment"># 卸载</span>
adb logcat -s MainActivity     <span class="hljs-comment"># 按 tag 过滤日志</span>
adb shell am start -n com.example.app/.MainActivity   <span class="hljs-comment"># 启动 Activity</span>
adb shell pm list packages | grep example             <span class="hljs-comment"># 查询已安装包</span>
adb pull /sdcard/x.txt ./      <span class="hljs-comment"># 从设备取文件</span>
</code></pre>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="38" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h3 id="%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98%E6%8E%92%E6%9F%A5">常见问题排查</h3>
<table>
<thead>
<tr>
<th>现象</th>
<th>可能原因</th>
<th>处理</th>
</tr>
</thead>
<tbody>
<tr>
<td>Gradle Sync 卡住</td>
<td>依赖仓库不可达</td>
<td>配置 <code>init.gradle</code> 镜像</td>
</tr>
<tr>
<td><code>SDK location not found</code></td>
<td>缺少 <code>local.properties</code></td>
<td>指定 <code>sdk.dir</code></td>
</tr>
<tr>
<td>模拟器启动黑屏</td>
<td>未开启硬件加速 / 镜像架构不符</td>
<td>换镜像、开启 HAXM/WHPX</td>
</tr>
<tr>
<td>安装失败 <code>INSTALL_FAILED_UPDATE_INCOMPATIBLE</code></td>
<td>签名不一致</td>
<td>先卸载旧包</td>
</tr>
<tr>
<td>中文乱码</td>
<td>文件编码非 UTF-8</td>
<td>统一设置 UTF-8</td>
</tr>
</tbody>
</table>
<footer> <em>张丽，井明（数据科学与计算机学院）</em> <em>移动应用开发（Android+Kotlin）</em> <em>2026年秋</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer=" *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*" data-theme="am_purple" lang="zh-CN" data-marpit-pagination="39" style="--paginate:true;--footer: *张丽，井明（数据科学与计算机学院）* *移动应用开发（Android+Kotlin）* *2026年秋*;--theme:am_purple;" data-marpit-pagination-total="41" data-size="16:9">
<h2 id="%E6%9C%AC%E7%AB%A0%E5%B0%8F%E7%BB%93">本章小结</h2>
<ul>
<li>移动开发有原生、跨平台、Web 三条路线，本课程走<strong>原生 Kotlin + Compose</strong></li>
<li>Android 是分层系统：Linux 内核 → HAL → 原生库/ART → Framework → 应用</li>
<li><code>compileSdk</code> / <code>minSdk</code> / <code>targetSdk</code> 三者含义不同，决定兼容性与运行时行为</li>
<li>环境搭建的关键是 <strong>JDK + Android Studio + 国内镜像</strong></li>
<li>一个 Android 项目由 Gradle 驱动，产物是签名后的 APK / AAB</li>
</ul>

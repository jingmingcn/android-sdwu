<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 560" width="1200" height="560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c8c"/></marker></defs>
<style>
.h{font-size:21px;font-weight:700}
.cap{font-size:16px;fill:#8c8c8c}
.it{fill:#f2e9ef;stroke:#af79a1;stroke-width:1.5}
.bad{fill:#f6dcd6;stroke:#b3412f;stroke-width:2}
.new{fill:#e6eed3;stroke:#627a1f;stroke-width:2;stroke-dasharray:6 4}
.n{font-size:18px;font-weight:700;fill:#551645;font-family:Menlo,Consolas,monospace}
.s{font-size:16px;fill:#211112}
.ln{stroke:#8c8c8c;stroke-width:1.8;fill:none}
</style>
<text class="h" x="40" y="30" fill="#b3412f">✗ 不传 key：Compose 按「位置」识别每一项</text>
<text class="cap" x="220" y="66" text-anchor="middle">插入前</text>
<text class="cap" x="720" y="66" text-anchor="middle">在头部插入 X 之后</text>
<rect class="it" x="95" y="80" width="250" height="40" rx="8"/>
<text class="n" x="113" y="107">A</text>
<text class="s" x="165" y="107">▶ 收起</text>
<rect class="it" x="95" y="128" width="250" height="40" rx="8"/>
<text class="n" x="113" y="155">B</text>
<text class="s" x="165" y="155">▼ 展开</text>
<rect class="it" x="95" y="176" width="250" height="40" rx="8"/>
<text class="n" x="113" y="203">C</text>
<text class="s" x="165" y="203">▶ 收起</text>
<rect class="it" x="595" y="80" width="250" height="40" rx="8"/>
<text class="n" x="613" y="107">X</text>
<text class="s" x="665" y="107">▶ 收起</text>
<rect class="bad" x="595" y="128" width="250" height="40" rx="8"/>
<text class="n" x="613" y="155">A</text>
<text class="s" x="665" y="155">▼ 展开  ✗</text>
<rect class="bad" x="595" y="176" width="250" height="40" rx="8"/>
<text class="n" x="613" y="203">B</text>
<text class="s" x="665" y="203">▶ 收起  ✗</text>
<rect class="it" x="595" y="224" width="250" height="40" rx="8"/>
<text class="n" x="613" y="251">C</text>
<text class="s" x="665" y="251">▶ 收起</text>
<path class="ln" d="M345,100 H589" marker-end="url(#a)"/>
<path class="ln" d="M345,148 H589" marker-end="url(#a)"/>
<path class="ln" d="M345,196 H589" marker-end="url(#a)"/>
<text class="cap" x="467" y="72" text-anchor="middle">按位置 0、1、2 对应</text>
<text x="870" y="140" font-size="17" fill="#b3412f">B 的「展开」状态</text>
<text x="870" y="166" font-size="17" fill="#b3412f">错位到了 A 身上；</text>
<text x="870" y="192" font-size="17" fill="#b3412f">其后每一项都要重组</text>
<line x1="40" y1="285" x2="1160" y2="285" stroke="#e4d2e0" stroke-width="2"/>
<text class="h" x="40" y="315" fill="#627a1f">✓ key = { it.id }：Compose 按「身份」识别每一项</text>
<text class="cap" x="220" y="351" text-anchor="middle">插入前</text>
<text class="cap" x="720" y="351" text-anchor="middle">在头部插入 X 之后</text>
<rect class="it" x="95" y="365" width="250" height="40" rx="8"/>
<text class="n" x="113" y="392">A</text>
<text class="s" x="165" y="392">▶ 收起</text>
<rect class="it" x="95" y="413" width="250" height="40" rx="8"/>
<text class="n" x="113" y="440">B</text>
<text class="s" x="165" y="440">▼ 展开</text>
<rect class="it" x="95" y="461" width="250" height="40" rx="8"/>
<text class="n" x="113" y="488">C</text>
<text class="s" x="165" y="488">▶ 收起</text>
<rect class="new" x="595" y="365" width="250" height="40" rx="8"/>
<text class="n" x="613" y="392">X</text>
<text class="s" x="665" y="392">▶ 收起  新建</text>
<rect class="it" x="595" y="413" width="250" height="40" rx="8"/>
<text class="n" x="613" y="440">A</text>
<text class="s" x="665" y="440">▶ 收起</text>
<rect class="it" x="595" y="461" width="250" height="40" rx="8"/>
<text class="n" x="613" y="488">B</text>
<text class="s" x="665" y="488">▼ 展开  ✓</text>
<rect class="it" x="595" y="509" width="250" height="40" rx="8"/>
<text class="n" x="613" y="536">C</text>
<text class="s" x="665" y="536">▶ 收起</text>
<path class="ln" d="M345,385 L589,433" marker-end="url(#a)"/>
<path class="ln" d="M345,433 L589,481" marker-end="url(#a)"/>
<path class="ln" d="M345,481 L589,529" marker-end="url(#a)"/>
<text class="cap" x="467" y="357" text-anchor="middle">按 id 对应</text>
<text x="870" y="425" font-size="17" fill="#627a1f">状态跟着 id 走；</text>
<text x="870" y="451" font-size="17" fill="#627a1f">只新建 X，A/B/C 原样</text>
<text x="870" y="477" font-size="17" fill="#627a1f">移动（还可做位移动画）</text>
</svg>
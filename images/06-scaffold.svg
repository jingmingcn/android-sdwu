<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" width="560" height="600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <style>
    .m{font-family:Menlo,Consolas,monospace;font-size:16px}
    .t{font-size:14px;fill:#8c8c8c}
  </style>
  <rect x="20" y="20" width="300" height="560" rx="30" fill="#ffffff" stroke="#211112" stroke-width="4"/>
  <!-- top bar -->
  <rect x="32" y="50" width="276" height="56" fill="#954c81"/>
  <text class="m" x="48" y="84" fill="#fff">topBar</text>
  <!-- content -->
  <rect x="32" y="106" width="276" height="364" fill="#f2e9ef"/>
  <text class="m" x="48" y="136" fill="#551645">content(padding)</text>
  <g fill="#e4d2e0"><rect x="48" y="152" width="244" height="34" rx="6"/><rect x="48" y="194" width="244" height="34" rx="6"/><rect x="48" y="236" width="244" height="34" rx="6"/><rect x="48" y="278" width="244" height="34" rx="6"/></g>
  <!-- snackbar -->
  <rect x="44" y="398" width="252" height="48" rx="8" fill="#323232"/>
  <text x="58" y="428" font-size="15" fill="#fff">已删除 1 项</text>
  <text x="282" y="428" font-size="15" fill="#e4a6d3" text-anchor="end" font-weight="700">撤销</text>
  <!-- fab -->
  <rect x="236" y="330" width="56" height="56" rx="16" fill="#551645"/>
  <text x="264" y="368" text-anchor="middle" font-size="30" fill="#fff">+</text>
  <!-- bottom bar -->
  <rect x="32" y="470" width="276" height="80" fill="#e4d2e0"/>
  <text class="m" x="48" y="516" fill="#551645">bottomBar</text>

  <!-- labels -->
  <g stroke="#8c8c8c" stroke-width="1.5">
    <line x1="308" y1="78" x2="350" y2="78"/>
    <line x1="308" y1="160" x2="350" y2="160"/>
    <line x1="292" y1="358" x2="350" y2="358"/>
    <line x1="296" y1="422" x2="350" y2="422"/>
    <line x1="308" y1="510" x2="350" y2="510"/>
  </g>
  <text class="m" x="358" y="83" fill="#551645">topBar</text>
  <text class="m" x="358" y="156" fill="#551645">content</text>
  <text class="t" x="358" y="178">务必使用 padding 参数，</text>
  <text class="t" x="358" y="198">否则被顶栏/底栏遮挡</text>
  <text class="m" x="358" y="354" fill="#551645">floatingActionButton</text>
  <text class="m" x="358" y="418" fill="#551645">snackbarHost</text>
  <text class="t" x="358" y="440">位于 FAB、底栏之上</text>
  <text class="m" x="358" y="515" fill="#551645">bottomBar</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#551645"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#627a1f"/></marker>
  </defs>
  <style>
    .h{font-size:22px;font-weight:700;fill:#551645}
    .m{font-family:Menlo,Consolas,monospace;font-size:17px}
    .t{font-size:16px;fill:#211112}
    .gray{font-size:15px;fill:#8c8c8c}
    .outer{fill:#ffffff;stroke:#954c81;stroke-width:2}
    .st{fill:#e6eed3;stroke:#627a1f;stroke-width:2}
    .cmp{fill:#f2e9ef;stroke:#af79a1;stroke-width:2}
  </style>
  <!-- left -->
  <text class="h" x="40" y="40">提升前：状态藏在组件内部</text>
  <rect class="outer" x="40" y="70" width="460" height="330" rx="14"/>
  <text class="m" x="60" y="104" fill="#551645">ParentScreen()</text>
  <rect class="cmp" x="80" y="130" width="380" height="200" rx="12"/>
  <text class="m" x="100" y="162" fill="#551645">StatefulCounter()</text>
  <rect class="st" x="110" y="184" width="320" height="50" rx="25"/>
  <text class="m" x="270" y="215" text-anchor="middle" fill="#3d4d13">var count = remember{…}</text>
  <rect x="190" y="258" width="160" height="48" rx="24" fill="#954c81"/>
  <text x="270" y="288" text-anchor="middle" font-size="17" fill="#fff">Button: 3</text>
  <text class="gray" x="80" y="362">✗ 父组件读不到 count，无法共享、无法重置</text>
  <text class="gray" x="80" y="386">✗ 预览、测试都只能从 0 开始</text>

  <!-- right -->
  <text class="h" x="620" y="40">提升后：状态交给调用方</text>
  <rect class="outer" x="620" y="70" width="540" height="390" rx="14"/>
  <text class="m" x="640" y="104" fill="#551645">CounterScreen()</text>
  <rect class="st" x="740" y="120" width="300" height="50" rx="25"/>
  <text class="m" x="890" y="151" text-anchor="middle" fill="#3d4d13">var count = …（唯一数据源）</text>

  <rect class="cmp" x="645" y="290" width="230" height="110" rx="12"/>
  <text class="m" x="760" y="322" text-anchor="middle" fill="#551645">StatelessCounter</text>
  <text class="t" x="760" y="350" text-anchor="middle">count: Int</text>
  <text class="t" x="760" y="376" text-anchor="middle">onIncrement: () -&gt; Unit</text>

  <rect class="cmp" x="905" y="290" width="230" height="110" rx="12"/>
  <text class="m" x="1020" y="322" text-anchor="middle" fill="#551645">StatelessCounter</text>
  <text class="t" x="1020" y="350" text-anchor="middle">count: Int</text>
  <text class="t" x="1020" y="376" text-anchor="middle">onDecrement: () -&gt; Unit</text>

  <!-- arrows: state down (purple), events up (green) -->
  <path d="M800,170 L740,284" stroke="#551645" stroke-width="2.5" fill="none" marker-end="url(#p)"/>
  <path d="M960,170 L1000,284" stroke="#551645" stroke-width="2.5" fill="none" marker-end="url(#p)"/>
  <path d="M790,290 L850,176" stroke="#627a1f" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <path d="M1040,290 L1000,176" stroke="#627a1f" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="660" y="226" font-size="16" fill="#551645" font-weight="700">状态 ↓</text>
  <text x="1060" y="226" font-size="16" fill="#627a1f" font-weight="700">事件 ↑</text>
  <text class="gray" x="640" y="440">✓ 两个子组件共享同一个 count；子组件可单独预览、测试</text>
</svg>

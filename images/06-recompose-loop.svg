<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#551645"/></marker>
  </defs>
  <style>
    .box{fill:#f2e9ef;stroke:#954c81;stroke-width:2}
    .ttl{font-size:22px;font-weight:700;fill:#551645}
    .txt{font-size:17px;fill:#211112}
    .code{font-family:Menlo,Consolas,'JetBrains Mono',monospace;font-size:16px;fill:#954c81}
    .lbl{font-size:15px;fill:#8c8c8c}
    .ln{stroke:#551645;stroke-width:2.5;fill:none}
  </style>

  <rect class="box" x="60" y="40" width="360" height="130" rx="14"/>
  <text class="ttl" x="84" y="80">① 组合 / 重组</text>
  <text class="txt" x="84" y="114">执行 @Composable 函数</text>
  <text class="txt" x="84" y="144">生成或更新 UI 树</text>

  <rect class="box" x="580" y="40" width="360" height="130" rx="14"/>
  <text class="ttl" x="604" y="80">② 读取 State</text>
  <text class="code" x="604" y="114">Text("点击 $count 次")</text>
  <text class="txt" x="604" y="144">Compose 登记：此作用域依赖 count</text>

  <rect class="box" x="580" y="290" width="360" height="130" rx="14"/>
  <text class="ttl" x="604" y="330">③ 写入 State</text>
  <text class="code" x="604" y="364">onClick = { count++ }</text>
  <text class="txt" x="604" y="394">快照系统（Snapshot）感知到写入</text>

  <rect class="box" x="60" y="290" width="360" height="130" rx="14"/>
  <text class="ttl" x="84" y="330">④ 标记失效</text>
  <text class="txt" x="84" y="364">依赖 count 的作用域被标记</text>
  <text class="txt" x="84" y="394">下一帧只重新执行这些作用域</text>

  <path class="ln" d="M420,105 H574" marker-end="url(#a)"/>
  <text class="lbl" x="440" y="94">执行中读取</text>
  <path class="ln" d="M760,170 V284" marker-end="url(#a)"/>
  <text class="lbl" x="772" y="232">用户事件</text>
  <path class="ln" d="M580,355 H426" marker-end="url(#a)"/>
  <text class="lbl" x="452" y="344">通知观察者</text>
  <path class="ln" d="M240,290 V176" marker-end="url(#a)"/>
  <text class="lbl" x="252" y="232">新一帧</text>

  <circle cx="500" cy="230" r="62" fill="#551645"/>
  <text x="500" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">状态驱动</text>
  <text x="500" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">UI</text>
</svg>

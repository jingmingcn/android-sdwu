<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <style>
    .ph{fill:#ffffff;stroke:#551645;stroke-width:3}
    .bar{fill:#e4d2e0}
    .h{font-size:20px;font-weight:700;fill:#551645}
    .m{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#954c81}
    .t{font-size:15px;fill:#8c8c8c}
  </style>
  <!-- phone 1 loading -->
  <g transform="translate(40,20)">
    <text class="h" x="120" y="22" text-anchor="middle">加载中</text>
    <text class="m" x="120" y="44" text-anchor="middle">isLoading = true</text>
    <rect class="ph" x="20" y="60" width="200" height="340" rx="22"/>
    <rect class="bar" x="20" y="60" width="200" height="44" rx="22"/><rect class="bar" x="20" y="84" width="200" height="20"/>
    <circle cx="120" cy="240" r="28" fill="none" stroke="#e4d2e0" stroke-width="7"/>
    <path d="M120,212 A28,28 0 0 1 148,240" fill="none" stroke="#954c81" stroke-width="7" stroke-linecap="round"/>
    <text class="t" x="120" y="300" text-anchor="middle">CircularProgress…</text>
  </g>
  <!-- phone 2 error -->
  <g transform="translate(330,20)">
    <text class="h" x="120" y="22" text-anchor="middle">出错</text>
    <text class="m" x="120" y="44" text-anchor="middle">error != null</text>
    <rect class="ph" x="20" y="60" width="200" height="340" rx="22"/>
    <rect class="bar" x="20" y="60" width="200" height="44" rx="22"/><rect class="bar" x="20" y="84" width="200" height="20"/>
    <circle cx="120" cy="210" r="28" fill="#b3412f"/>
    <text x="120" y="221" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">!</text>
    <text x="120" y="270" text-anchor="middle" font-size="15" fill="#211112">网络连接失败</text>
    <rect x="70" y="290" width="100" height="36" rx="18" fill="#954c81"/>
    <text x="120" y="314" text-anchor="middle" font-size="15" fill="#fff">重试</text>
  </g>
  <!-- phone 3 empty -->
  <g transform="translate(620,20)">
    <text class="h" x="120" y="22" text-anchor="middle">空</text>
    <text class="m" x="120" y="44" text-anchor="middle">items.isEmpty()</text>
    <rect class="ph" x="20" y="60" width="200" height="340" rx="22"/>
    <rect class="bar" x="20" y="60" width="200" height="44" rx="22"/><rect class="bar" x="20" y="84" width="200" height="20"/>
    <rect x="88" y="195" width="64" height="44" rx="4" fill="none" stroke="#af79a1" stroke-width="3"/>
    <path d="M88,195 L104,178 H136 L152,195" fill="none" stroke="#af79a1" stroke-width="3"/>
    <text x="120" y="275" text-anchor="middle" font-size="15" fill="#211112">还没有任何待办</text>
    <text x="120" y="298" text-anchor="middle" font-size="15" fill="#8c8c8c">点击 + 添加</text>
    <circle cx="186" cy="364" r="20" fill="#954c81"/><text x="186" y="372" text-anchor="middle" font-size="24" fill="#fff">+</text>
  </g>
  <!-- phone 4 data -->
  <g transform="translate(910,20)">
    <text class="h" x="120" y="22" text-anchor="middle">有数据</text>
    <text class="m" x="120" y="44" text-anchor="middle">else</text>
    <rect class="ph" x="20" y="60" width="200" height="340" rx="22"/>
    <rect class="bar" x="20" y="60" width="200" height="44" rx="22"/><rect class="bar" x="20" y="84" width="200" height="20"/>
    <g fill="#f2e9ef" stroke="#af79a1">
      <rect x="34" y="118" width="172" height="40" rx="6"/><rect x="34" y="166" width="172" height="40" rx="6"/>
      <rect x="34" y="214" width="172" height="40" rx="6"/><rect x="34" y="262" width="172" height="40" rx="6"/>
      <rect x="34" y="310" width="172" height="40" rx="6"/>
    </g>
    <g fill="none" stroke="#954c81" stroke-width="2">
      <rect x="44" y="129" width="18" height="18" rx="3"/><rect x="44" y="177" width="18" height="18" rx="3"/>
      <rect x="44" y="225" width="18" height="18" rx="3"/><rect x="44" y="273" width="18" height="18" rx="3"/><rect x="44" y="321" width="18" height="18" rx="3"/>
    </g>
    <g fill="#d5c2cf"><rect x="72" y="133" width="100" height="10" rx="5"/><rect x="72" y="181" width="80" height="10" rx="5"/><rect x="72" y="229" width="110" height="10" rx="5"/><rect x="72" y="277" width="70" height="10" rx="5"/><rect x="72" y="325" width="96" height="10" rx="5"/></g>
    <circle cx="186" cy="364" r="20" fill="#954c81"/><text x="186" y="372" text-anchor="middle" font-size="24" fill="#fff">+</text>
  </g>
  <text x="600" y="450" text-anchor="middle" font-size="15" fill="#8c8c8c">同一个 UiState，四种互斥的外观；when 的判断顺序决定优先级</text>
</svg>
